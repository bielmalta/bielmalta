<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-labelledby="title desc">
  <title id="title">GitHub repository signal</title>
  <desc id="desc">Animated local panel inviting visitors to explore Gabriel Malta's public repositories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090D1D"/><stop offset="1" stop-color="#151035"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="878" height="148" rx="20" fill="url(#bg)" stroke="#334155"/>
  <path d="M28 24h54M28 24v34M852 126h-54M852 126V92" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <g transform="translate(72 75)" fill="none" stroke="#22D3EE" filter="url(#glow)">
    <circle r="29" stroke-opacity=".35" stroke-dasharray="5 7">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" stroke="#A78BFA" stroke-opacity=".75"/>
    <circle r="5" fill="#22D3EE" stroke="none">
      <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="130" y="61" fill="#67E8F9" font-size="11" letter-spacing="3">PUBLIC REPOSITORY CHANNEL</text>
    <text x="130" y="92" fill="#F8FAFC" font-size="23" font-weight="700">EXPLORE THE BUILD LOG</text>
    <text x="130" y="116" fill="#94A3B8" font-size="13">Projects, experiments and progress live on GitHub.</text>
    <text x="760" y="79" fill="#C4B5FD" font-size="14" font-weight="700" text-anchor="middle">OPEN →</text>
  </g>
  <path d="M120 132H820" stroke="url(#scan)" stroke-width="2" stroke-dasharray="120 580">
    <animate attributeName="stroke-dashoffset" values="700;-700" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>
