<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Malta — orbital developer banner</title>
  <desc id="desc">A dark cosmic observatory interface with moving stars, neon orbits and Gabriel Malta's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060814"/><stop offset="0.52" stop-color="#0B1021"/><stop offset="1" stop-color="#151035"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".48" stop-color="#22D3EE"/><stop offset=".54" stop-color="#A78BFA"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="planet">
      <stop stop-color="#C4B5FD"/><stop offset=".32" stop-color="#8B5CF6"/><stop offset="1" stop-color="#312E81"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#67E8F9" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="8" y="8" width="1184" height="324" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <g fill="#E0F2FE">
      <circle cx="90" cy="72" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="250" r="1"><animate attributeName="opacity" values="1;.15;1" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="55" r="1.4"><animate attributeName="opacity" values=".2;.9;.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="485" cy="282" r="1"><animate attributeName="opacity" values=".9;.2;.9" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="728" cy="65" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="4.3s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="278" r="1.4"><animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="65" r="1"><animate attributeName="opacity" values=".1;1;.1" dur="5.7s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(1010 170)" fill="none" stroke-linecap="round">
      <ellipse rx="126" ry="48" stroke="#22D3EE" stroke-opacity=".38" transform="rotate(-18)" stroke-dasharray="9 13">
        <animateTransform attributeName="transform" type="rotate" values="-18;342" dur="28s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="91" ry="91" stroke="#A78BFA" stroke-opacity=".27" stroke-dasharray="4 11">
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="22s" repeatCount="indefinite"/>
      </ellipse>
      <circle r="38" fill="url(#planet)" stroke="#C4B5FD" stroke-opacity=".7" filter="url(#glow)"/>
      <circle cx="86" cy="-25" r="5" fill="#22D3EE" stroke="none" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <path d="M60 267H840" stroke="url(#line)" stroke-width="2" stroke-dasharray="140 640">
      <animate attributeName="stroke-dashoffset" values="780;-780" dur="6s" repeatCount="indefinite"/>
    </path>
    <g font-family="Segoe UI,Arial,sans-serif">
      <text x="70" y="72" fill="#67E8F9" font-size="13" letter-spacing="5">ORBITAL OBSERVATORY / 08°03′S 34°52′W</text>
      <text x="70" y="160" fill="#F4F7FF" font-size="58" font-weight="700" letter-spacing="2">GABRIEL MALTA</text>
      <text x="73" y="202" fill="#A78BFA" font-size="20" letter-spacing="7">SOFTWARE EXPLORER</text>
      <text x="72" y="242" fill="#94A3B8" font-size="15" letter-spacing="2">COMPUTER SCIENCE • RECIFE, BRAZIL</text>
      <text x="70" y="305" fill="#22D3EE" font-size="12" letter-spacing="3">SIGNAL</text>
      <circle cx="140" cy="301" r="4" fill="#34D399" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="154" y="305" fill="#C8D3F5" font-size="12" letter-spacing="3">ONLINE · @BIELMALTA</text>
    </g>
  </g>
  <rect x="8" y="8" width="1184" height="324" rx="22" fill="none" stroke="#22D3EE" stroke-opacity=".25"/>
  <path d="M28 8h110M1062 8h110M8 28v70M1192 242v70" stroke="#A78BFA" stroke-width="2"/>
</svg>
