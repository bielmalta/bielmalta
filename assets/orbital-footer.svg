<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="95" viewBox="0 0 1200 95" role="img" aria-labelledby="title">
  <title id="title">Animated orbital signal footer</title>
  <defs><linearGradient id="line"><stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".3" stop-color="#22D3EE"/><stop offset=".7" stop-color="#A78BFA"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <path d="M0 48H420l24-20 26 40 28-58 30 74 30-60 26 45 26-21h590" fill="none" stroke="#1E293B" stroke-width="2"/>
