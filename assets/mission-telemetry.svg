<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-labelledby="title desc">
  <title id="title">Mission telemetry</title><desc id="desc">Three animated status cards: learn deeply, build clearly and collaborate openly.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#090D1D"/><stop offset="1" stop-color="#12102B"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="1" y="1" width="878" height="178" rx="20" fill="url(#bg)" stroke="#334155"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(32 28)"><rect width="250" height="124" rx="14" fill="#0D1428" stroke="#22D3EE" stroke-opacity=".55"/><circle cx="26" cy="26" r="5" fill="#22D3EE" filter="url(#g)"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle><text x="44" y="31" fill="#67E8F9" font-size="11" letter-spacing="2">VECTOR 01</text><text x="20" y="72" fill="#F8FAFC" font-size="19" font-weight="700">LEARN DEEPLY</text><text x="20" y="98" fill="#94A3B8" font-size="13">Foundations before shortcuts.</text></g>
    <g transform="translate(315 28)"><rect width="250" height="124" rx="14" fill="#0D1428" stroke="#A78BFA" stroke-opacity=".55"/><circle cx="26" cy="26" r="5" fill="#A78BFA" filter="url(#g)"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle><text x="44" y="31" fill="#C4B5FD" font-size="11" letter-spacing="2">VECTOR 02</text><text x="20" y="72" fill="#F8FAFC" font-size="19" font-weight="700">BUILD CLEARLY</text><text x="20" y="98" fill="#94A3B8" font-size="13">Simple systems. Useful outcomes.</text></g>
    <g transform="translate(598 28)"><rect width="250" height="124" rx="14" fill="#0D1428" stroke="#34D399" stroke-opacity=".55"/><circle cx="26" cy="26" r="5" fill="#34D399" filter="url(#g)"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle><text x="44" y="31" fill="#6EE7B7" font-size="11" letter-spacing="2">VECTOR 03</text><text x="20" y="72" fill="#F8FAFC" font-size="19" font-weight="700">GROW TOGETHER</text><text x="20" y="98" fill="#94A3B8" font-size="13">Share, review and improve.</text></g>
  </g>
</svg>
